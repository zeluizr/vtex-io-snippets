name: test

on:
  push:
    branches: [main, qa, dev]
  pull_request:
    branches: [main, qa, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # A extensão não tem dependência de runtime; o `sharp` (desenvolvimento) só
      # gera o ícone e a imagem do README, fora do CI.
      - name: Instalar dependências
        run: npm ci
      - name: Regerar schema + snippets (deve ser determinístico)
        run: node scripts/generate-schema.js
      - name: Falhar se o gerado derivou do commitado
        run: git diff --exit-code schemas/ snippets/
      - name: Rodar testes
        run: node --test
