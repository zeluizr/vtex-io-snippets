name: Release

# Empacota o .vsix ao enviar uma tag de versao (ex.: v4.2.1) e o anexa a Release
# do GitHub.
#
# NAO publica no Marketplace, e isso e deliberado: a publicacao aqui e sempre
# manual, com `vsce login commenteme` seguido de `vsce publish`. O passo de envio
# existia neste arquivo e NUNCA completou — falhava com `TF400813` desde as tags
# v2.2.3 e v2.2.4, de julho de 2026, porque o secret `VSCE_PAT` esta com token
# vencido. Toda tag acusava falha sem que nada estivesse errado.
#
# Se um dia a publicacao voltar a ser automatica, o passo e
# `npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"`, e o secret
# precisa de um PAT do Azure DevOps com organizacao "All accessible" e escopo
# Marketplace > Manage.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Empacotar o .vsix
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Anexar o .vsix a Release do GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
